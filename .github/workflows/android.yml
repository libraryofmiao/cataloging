name: Android build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Normalize Kotlin package keyword
        run: |
          find app/src/main/java -type f -name '*.kt' -print0 | xargs -0 sed -i -E 's/(package|import)[[:space:]]+in\.miaolibrary/\1 \x60in\x60.miaolibrary/g'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MiaoLibrary-Cataloging-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
